[project]
name = "android-harness"
version = "0.1.0"
description = "Control a real Android phone through ADB: screenshot eyes, input-injection hands"
requires-python = ">=3.10"
dependencies = [
    "paddlepaddle<3.0",
    "paddleocr<3.0",
    "Pillow",
]

[project.scripts]
android-harness = "android_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_harness"]
